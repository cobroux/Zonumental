spring.application.name=zonumental
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
springdoc.api-docs.version=openapi_3_1
springdoc.show-actuator=true
springdoc.paths-to-exclude=/api
spring.mail.host=localhost
spring.mail.port=1025
zonumental.mail.expediteur=no-reply@zonumental.fr
zonumental.front-url=http://localhost:4200
zonumental.legal.version-cgu=0.1-provisoire
zonumental.legal.version-confidentialite=0.1-provisoire
zonumental.compte.verification-duree=24h
management.health.mail.enabled=false
zonumental.jwt.secret=${ZONUMENTAL_JWT_SECRET}
zonumental.compte.session-duree=30d
zonumental.compte.suppression-delai=30d
