<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer mon carnet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F1EA; color: #1A1C20; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 18px 24px 26px; display: flex; flex-direction: column; gap: 18px">
  <svg aria-hidden="true" style="position: absolute; width: 0; height: 0">
    <filter id="paperO6"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0.10 0"></feColorMatrix></filter>
  </svg>
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"><rect width="100%" height="100%" filter="url(#paperO6)"></rect></svg>

  <header style="position: relative; display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="O1-Bienvenue.dc.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C20" stroke-width="1.9" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #5B5F66">ÉTAPE 1 / 2</span>
  </header>

  <h1 style="position: relative; margin: 0; font-family: 'Gloock', serif; font-weight: 400; font-size: 32px; line-height: 1">Crée ton carnet d'explorateur</h1>

  <form style="position: relative; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="{{f.id}}" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600">{{f.label}}<span style="font-weight: 400; color: #5B5F66; font-size: 12px">{{f.hint}}</span></label>
        <input id="{{f.id}}" type="{{f.type}}" placeholder="{{f.ph}}" autocomplete="{{f.ac}}" inputmode="{{f.im}}" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(26,28,32,0.22); background: #FBF9F4; font: inherit; font-size: 16px; color: #1A1C20">
      </div>
    </sc-for>

    <fieldset style="margin: 4px 0 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 8px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #5B5F66">TES CHOIX</legend>
      <sc-for list="{{consents}}" as="c" hint-placeholder-count="3">
        <label style="display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; line-height: 1.4; cursor: pointer">
          <input type="checkbox" checked="{{c.on}}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #1A1C20">
          <span>{{c.text}} <span style="color: #5B5F66">{{c.note}}</span></span>
        </label>
      </sc-for>
    </fieldset>
  </form>

  <div style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="O2-Localisation.dc.html" style="height: 54px; border-radius: 14px; background: #1A1C20; color: #FBF9F4; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Créer mon carnet</a>
    <p style="margin: 0; text-align: center; font-size: 12px; line-height: 1.4; color: #5B5F66; text-wrap: pretty">Export ou suppression de tes données à tout moment depuis Profil. Hébergé dans l'UE.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fields: [
        { id: 'pseudo', label: 'Pseudo', hint: 'visible seulement si tu l’acceptes', type: 'text', ph: 'ex. explorateur75', ac: 'username', im: 'text' },
        { id: 'email', label: 'E-mail', hint: 'pour retrouver ton carnet', type: 'email', ph: 'toi@exemple.fr', ac: 'email', im: 'email' },
        { id: 'mdp', label: 'Mot de passe', hint: '12 caractères minimum', type: 'password', ph: '', ac: 'new-password', im: 'text' },
        { id: 'naissance', label: 'Date de naissance', hint: '15 ans minimum', type: 'text', ph: 'JJ / MM / AAAA', ac: 'bday', im: 'numeric' }
      ],
      consents: [
        { text: 'J’accepte les CGU et la politique de confidentialité.', note: 'Obligatoire', on: false },
        { text: 'Apparaître dans les classements sous mon pseudo.', note: 'Facultatif', on: false },
        { text: 'Recevoir les nouveaux défis par e-mail.', note: 'Facultatif', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
