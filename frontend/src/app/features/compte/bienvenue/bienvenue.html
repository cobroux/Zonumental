<div class="page">
  <!-- D1 : visuel marine en attendant une photo à licence vérifiée (aucune image ajoutée) -->
  <div class="visuel" aria-hidden="true">
    <!-- dégradé haut de la maquette O1 en SVG : la règle design-system interdit gradient() en CSS -->
    <svg width="100%" height="140" focusable="false">
      <defs>
        <linearGradient id="zn-voile-haut" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--zn-nuit)" stop-opacity="0.45" />
          <stop offset="1" stop-color="var(--zn-nuit)" stop-opacity="0" />
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#zn-voile-haut)" />
    </svg>
    <!-- illustration vectorielle maison de l'Arc de Triomphe (D1 : pas de photo sans licence vérifiée) -->
    <svg class="arc" viewBox="0 0 300 220" focusable="false">
      <circle cx="222" cy="70" r="34" fill="var(--zn-fond)" fill-opacity="0.16" />
      <g fill="var(--zn-fond)" fill-opacity="0.9" fill-rule="evenodd">
        <path d="M60 220V70h180v150h-52v-72a38 38 0 0 0-76 0v72z" />
        <path d="M52 70h196v-14H52zM66 50h168v-8H66z" />
      </g>
      <g fill="var(--zn-marine)" fill-opacity="0.35">
        <path d="M70 100h24v30H70zM206 100h24v30h-24zM70 150h18v50H70zM212 150h18v50h-18z" />
      </g>
      <path d="M0 219h300" stroke="var(--zn-fond)" stroke-opacity="0.5" />
    </svg>
  </div>
  <span class="zn-mono etiquette">Carnet d’explorateur</span>

  <zn-tampon
    class="tampon"
    forme="ovale"
    encre="rare"
    [contenu]="{ haut: 'FRANCE · N°000', centre: 'Bienvenue', bas: '118 MONUMENTS À TAMPONNER' }"
    etiquette="Tampon : France, numéro 000, Bienvenue, 118 monuments à tamponner"
  />

  <section class="feuille">
    <svg class="grain" aria-hidden="true" focusable="false">
      <rect width="100%" height="100%" filter="url(#zn-papier)" />
    </svg>
    <h1>Zonumental</h1>
    <p>Va voir les monuments de France. Chaque visite imprime un tampon dans ton carnet.</p>
    <div class="pied">
      <a znBouton routerLink="/inscription">Commencer</a>
      <a class="lien" routerLink="/connexion">J’ai déjà un carnet</a>
    </div>
  </section>
</div>
